[pytest]
pythonpath = .
testpaths = backend/tests
markers =
    community_addons: cross-repo contract test that reads the community-add-ons checkout (see backend/tests/community_addons.py)
# A deprecation raised from our own code fails the run rather than joining the
# warnings summary, where nobody reads it until the removal breaks something
# (issue #790). Third-party deprecations stay warnings: they are fixed upstream.
filterwarnings =
    error::DeprecationWarning:backend
    error::PendingDeprecationWarning:backend
