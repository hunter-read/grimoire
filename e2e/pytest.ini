[pytest]
testpaths = tests
# `e2e/` is the rootdir, so the package importable as `grimoire_e2e` is right here.
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: fast checks that the app is alive and reachable
    auth: login, logout, setup, and session behaviour
    library: browsing systems, books, and the reader
    admin: settings and user administration
