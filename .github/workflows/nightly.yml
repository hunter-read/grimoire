name: Nightly

# Builds a multi-arch nightly image from `main`. Runs on a schedule rather than
# per-push so the tag tracks "yesterday's stable main" at a predictable time.
on:
  schedule:
    # 07:00 UTC daily — after typical evening merges in the Americas, before the
    # European working day. Cron in Actions is best-effort and can lag under
    # load; nothing here depends on the exact minute.
    - cron: "0 7 * * *"
  # Manual runs are useful to re-cut the tag after a hotfix without waiting for
  # the next window. `force` republishes even when main has not moved.
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main is unchanged since the last nightly"
        type: boolean
        default: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/grimoire
  # Mirrored to the GitHub Container Registry. GHCR needs a lowercase name,
  # which `github.repository` (hunter-read/grimoire) already is.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  nightly:
    name: Build and push nightly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # A quiet day would otherwise republish a byte-identical image every
      # night. Compare main's HEAD against the revision label on the nightly
      # tag already in the registry and stop early when they match. A missing
      # tag (first run) or an unreadable label falls through to building.
      - name: Check whether main moved since the last nightly
        id: changed
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced run — building regardless of the previous nightly."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV="$(docker buildx imagetools inspect "${IMAGE}:nightly" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' \
            2>/dev/null || true)"

          if [ -z "$PREV" ] || [ "$PREV" = "<no value>" ]; then
            echo "No readable revision on ${IMAGE}:nightly — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$PREV" = "$SHA" ]; then
            echo "main is unchanged since the last nightly ($SHA) — skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved: $PREV -> $SHA — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to DockerHub
        if: steps.changed.outputs.build == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.changed.outputs.build == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push nightly
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ocr
          push: true
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            APP_VERSION=nightly
            COMMIT_HASH=${{ steps.changed.outputs.sha }}
          # The revision label is what the next run's skip check reads back;
          # the source label links the GHCR package to this repo.
          labels: |
            org.opencontainers.image.revision=${{ steps.changed.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:nightly
            ${{ env.GHCR_IMAGE }}:nightly
          # Its own cache scope, kept apart from the CI image builds.
          cache-from: type=gha,scope=nightly
          cache-to: type=gha,mode=max,scope=nightly

      - name: Log out of registries
        if: always()
        run: |
          docker logout
          docker logout ghcr.io
