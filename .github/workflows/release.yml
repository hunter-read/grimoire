name: Release

# Trigger by pushing a version tag: git tag v1.9.2 && git push origin v1.9.2
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/grimoire
  # Mirrored to the GitHub Container Registry. GHCR needs a lowercase name,
  # which `github.repository` (hunter-read/grimoire) already is.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Parse v1.9.2 → major=1, minor=1.9, patch=1.9.2
      - name: Parse version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v1.9.2
          VERSION="${TAG#v}"                 # e.g. 1.9.2
          MAJOR="${VERSION%%.*}"             # e.g. 1
          MINOR="${VERSION%.*}"              # e.g. 1.9
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR"       >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR"       >> "$GITHUB_OUTPUT"

      # The VERSION file is what a non-Docker install reports in the About
      # dialog (issue #457), and nothing at runtime can detect that it is
      # stale. Fail the release rather than ship a tarball that misreports
      # itself - the fix is one commit bumping the file to match the tag.
      - name: Check VERSION file matches the tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::VERSION file says '$FILE_VERSION' but the tag says '${{ steps.ver.outputs.version }}'. Bump VERSION and re-tag."
            exit 1
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Release images are built from scratch each time, without the Actions
      # build cache that CI and nightly share between runs.
      # Default image: bundles Tesseract OCR (see Dockerfile `ocr` target).
      - name: Build and push (OCR)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ocr
          push: true
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
          # Links the GHCR package to this repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.major }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.minor }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.major }}
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.minor }}
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.version }}

      # Slim variant: no OCR engine, smaller image (see Dockerfile `slim` target).
      - name: Build and push (slim, no OCR)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: slim
          push: true
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
          # Links the GHCR package to this repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:slim
            ${{ env.IMAGE }}:${{ steps.ver.outputs.major }}-slim
            ${{ env.IMAGE }}:${{ steps.ver.outputs.minor }}-slim
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-slim
            ${{ env.GHCR_IMAGE }}:slim
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.major }}-slim
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.minor }}-slim
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.version }}-slim

      - name: Log out of registries
        if: always()
        run: |
          docker logout
          docker logout ghcr.io

  # Runs once both images are published, as its own job so it holds only the
  # permission it needs to create the release.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
