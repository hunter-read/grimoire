name: Test order

# Runs the backend suite on main split differently from CI, so a test that only
# passes because of where CI's split puts it shows up here rather than on an
# unrelated PR. CI's split (see conftest.py) hands each worker a contiguous run
# of files, eight in all over two jobs; serially every file sees all its
# predecessors, and on two workers the second half loses them. Each split runs
# on SQLite and on the oldest and newest supported PostgreSQL, since CI runs
# PostgreSQL only on its own split. Not a required check - a failure here means
# an order-dependent test to fix, not a broken main.
on:
  schedule:
    # 06:00 UTC daily, an hour before the nightly image build. Best-effort, like
    # every scheduled trigger.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.split.name }}, ${{ matrix.database.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        split:
          - name: serial
            workers: "0"
          - name: two workers
            workers: "2"
        database:
          - name: SQLite
            image: ""
          # Pinned by digest, the same images as ci.yml; bumped by hand
          # (docs/pipelines.md#dependabot-dependabotyml).
          - name: PostgreSQL 15
            image: postgres:15-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
          - name: PostgreSQL 18
            image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    # An empty image skips the service, so the SQLite legs start no server.
    services:
      postgres:
        image: ${{ matrix.database.image }}
        env:
          POSTGRES_USER: grimoire
          POSTGRES_PASSWORD: grimoire
          POSTGRES_DB: grimoire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grimoire" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      # No community add-ons checkout, so their contract tests skip: ci.yml
      # pins that repo and runs them on every PR, and this job is about order.
      - name: Run tests
        env:
          # Empty on the SQLite legs, which conftest reads as "use SQLite".
          TEST_DATABASE_URL: ${{ matrix.database.image && 'postgresql://grimoire:grimoire@localhost:5432/grimoire' || '' }}
        run: pytest backend/tests/ -q -n ${{ matrix.split.workers }} --dist loadgroup
