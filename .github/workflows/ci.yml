name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same PR makes the run in progress pointless: cancel it
# rather than let it hold runners. Pushes to main always finish, since the
# coverage badges and nightly images come from them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; no job here writes to the repository. The coverage
# badges are written to gists with the GIST_SECRET token, not GITHUB_TOKEN, and
# only by the coverage-badges job: the jobs that run code - this repo's tests
# and the community add-ons' scripts - never see a secret.
permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      # frontend/src is all TypeScript (issue #587); keep it that way.
      - name: Check src has no JavaScript
        working-directory: frontend
        run: npm run typescript:check

      - name: Build
        working-directory: frontend
        run: npm run build

  # The test suite is split three ways and run in parallel: most of its time is
  # building a jsdom environment for each of ~470 files, which parallelises
  # across runners where it can't within one. Each shard writes a blob report
  # holding its results and coverage, merged by the `frontend` job below.
  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=dot --reporter=blob

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest/blob/
          # The directory starts with a dot, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Keeps the name branch protection requires. It runs even when a job it needs
  # failed (a skipped required check would count as passed) and fails itself
  # then, so the frontend is only green when lint, build and every shard are.
  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    needs: [frontend-checks, frontend-tests]
    if: always()
    steps:
      - name: Lint, build and every test shard passed
        env:
          CHECKS: ${{ needs.frontend-checks.result }}
          TESTS: ${{ needs.frontend-tests.result }}
        run: |
          echo "lint + build: $CHECKS, tests: $TESTS"
          test "$CHECKS" = success && test "$TESTS" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the per-changed-file coverage gate can diff against
          # the PR base branch.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest/blob
          merge-multiple: true

      # Rebuilds coverage/coverage-summary.json from the shards' blobs: the same
      # report one unsharded run writes, so the gate and badge read it unchanged.
      - name: Merge test results and coverage
        working-directory: frontend
        run: npx vitest run --merge-reports --coverage --reporter=dot

      - name: Check per-changed-file coverage
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          npm run coverage:check

      # The badge is published by the coverage-badges job, which holds the
      # secret it needs; this job only hands it the summary.
      - name: Upload coverage summary for the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 1
          if-no-files-found: error

  # The frontend's API types (frontend/src/api/schema.d.ts) are generated from
  # the backend's OpenAPI schema. Regenerate them and fail if the committed copy
  # differs, so a backend change to a request or response shape lands together
  # with the frontend diff it causes - and tsc in the frontend job checks the
  # code against it. Needs both toolchains: Python exports the schema straight
  # from the app (no server), Node turns it into TypeScript.
  api-types:
    name: API types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API types
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run api:types:check

  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the per-changed-file coverage gate can diff against
          # the PR base branch.
          fetch-depth: 0

      # The cross-repo contract tests check the add-ons actually published in
      # the community repo against this repo's interpreter, importer and sheet
      # renderer (see backend/tests/community_addons.py). Without this checkout
      # they skip, and REQUIRE_COMMUNITY_ADDONS below turns those skips into a
      # failure, so a missing or renamed path can't hide them again.
      #
      # Pinned to a commit: the tests run that repo's add-on scripts, so what
      # runs here is a reviewed snapshot rather than whatever its default branch
      # holds at the time. To bump it, review the community repo's changes since
      # this commit, then take its current head with
      #   git ls-remote https://github.com/grimoire-codex/community-add-ons refs/heads/main
      # (docs/pipelines.md, "Community add-on contract tests").
      - name: Check out community add-ons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grimoire-codex/community-add-ons
          ref: 0c97dc5d6eab7317f29f99ae40bdd21b2494a1ba
          path: community-add-ons
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Run lint
        run: ruff check backend/

      - name: Check imports
        run: python -c "import backend.main"

      - name: Type check
        run: mypy backend/

      # Four workers, one per runner core (pytest-xdist). conftest.py hands each
      # a contiguous run of test files in their usual order, so the tests see
      # the same predecessors they do in a serial run; the worker count is fixed
      # rather than "auto" so those slices are the same on every run. sysmon is
      # Python 3.12's low-overhead tracing hook, which makes measuring coverage
      # far cheaper than the default tracer (line coverage is all the gate reads).
      - name: Run tests with coverage
        env:
          COMMUNITY_ADDONS_PATH: ${{ github.workspace }}/community-add-ons
          REQUIRE_COMMUNITY_ADDONS: "true"
          COVERAGE_CORE: sysmon
        run: >-
          pytest backend/tests/ -n 4 --dist loadgroup
          --cov=backend --cov-report=json --cov-report=term

      - name: Check per-changed-file coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          python backend/scripts/check_coverage.py

      # See the frontend job: the coverage-badges job publishes the badge.
      - name: Upload coverage report for the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: coverage.json
          retention-days: 1
          if-no-files-found: error

  # Publishes the README's coverage badges on a push to main, so they track the
  # released code. It is the only job holding a secret (GIST_SECRET, a token
  # scoped to gists), and it runs no code from the repository: it checks
  # nothing out, only downloads the two coverage reports the test jobs upload,
  # reads one number from each and writes it to a Shields.io endpoint gist.
  # Each badge updates only when its own tests passed. Needs the GIST_SECRET
  # secret and the BACKEND_/FRONTEND_COVERAGE_GIST_ID variables.
  coverage-badges:
    name: Coverage badges
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    steps:
      - name: Download frontend coverage
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend-coverage

      - name: Download backend coverage
        if: needs.backend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend-coverage

      # float() means only a number can reach the badge, whatever the file holds.
      - name: Extract coverage %
        id: cov
        env:
          FRONTEND_OK: ${{ needs.frontend.result == 'success' }}
          BACKEND_OK: ${{ needs.backend.result == 'success' }}
        run: |
          if [ "$FRONTEND_OK" = true ]; then
            pct=$(python3 -c "import json; print(round(float(json.load(open('frontend-coverage/coverage-summary.json'))['total']['lines']['pct']), 1))")
            echo "frontend=${pct}" >> "$GITHUB_OUTPUT"
          fi
          if [ "$BACKEND_OK" = true ]; then
            pct=$(python3 -c "import json; print(round(float(json.load(open('backend-coverage/coverage.json'))['totals']['percent_covered']), 1))")
            echo "backend=${pct}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update frontend coverage badge
        if: needs.frontend.result == 'success'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.FRONTEND_COVERAGE_GIST_ID }}
          filename: grimoire-frontend-coverage.json
          label: frontend coverage
          message: ${{ steps.cov.outputs.frontend }}%
          valColorRange: ${{ steps.cov.outputs.frontend }}
          minColorRange: 50
          maxColorRange: 90

      - name: Update backend coverage badge
        if: needs.backend.result == 'success'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BACKEND_COVERAGE_GIST_ID }}
          filename: grimoire-backend-coverage.json
          label: backend coverage
          message: ${{ steps.cov.outputs.backend }}%
          valColorRange: ${{ steps.cov.outputs.backend }}
          minColorRange: 50
          maxColorRange: 90

  # Builds both image targets and starts each one on a tiny generated library
  # (backend/scripts/smoke_test_image.py): healthy, non-root, first-run setup,
  # scan, search, page render, thumbnails, unar/ffmpeg/tesseract, and an upgrade
  # from a root-owned /data. The unit tests run from a virtualenv, so this is
  # the only check that the image itself builds and serves before it ships -
  # `slim` used to be built for the first time at release.
  image-changes:
    name: Image inputs changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every push to main builds the image. A PR does when it touches what
      # goes into it: the Dockerfile, dependencies, backend code (the build runs
      # the app's start-up to warm its bytecode) or this workflow. Frontend
      # source, tests and docs are covered by the jobs above.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE"
          if git diff --name-only "origin/$BASE...HEAD" | grep -vE '^backend/tests/' | grep -qE \
            '^(Dockerfile|\.dockerignore|alembic\.ini|VERSION|backend/|frontend/package(-lock)?\.json|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Docker image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: image-changes
    if: needs.image-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [slim, ocr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only, and loaded locally rather than pushed. The GitHub Actions
      # cache keeps the ffmpeg build and the Python wheels between runs, so a
      # typical PR rebuilds only the layers its change touches.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          tags: grimoire:ci-${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=image-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.target }}

      - name: Smoke test
        run: python3 backend/scripts/smoke_test_image.py grimoire:ci-${{ matrix.target }} --target ${{ matrix.target }}

