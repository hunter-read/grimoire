name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    # A direct push to `dev` while the `dev -> main` PR is open makes CI run
    # twice for the same commit: once for `push` and once for `pull_request`.
    # Skip the redundant `pull_request` run when its head branch is `dev` — the
    # `push` run already covers that commit.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the per-changed-file coverage gate can diff against
          # the PR base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Check per-changed-file coverage
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          npm run coverage:check

      - name: Build
        working-directory: frontend
        run: npm run build

      # Publish a coverage badge from the numbers just computed. Runs only on a
      # push to main so the badge tracks the released code, never a PR/feature
      # branch. Extracts the total line-coverage % from the json-summary reporter
      # output and writes it to a Shields.io endpoint gist (no third-party service
      # ingests the code). Requires the GIST_SECRET repo secret and FRONTEND_COVERAGE_GIST_ID var.
      - name: Extract frontend coverage %
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: frontend_cov
        working-directory: frontend
        run: |
          pct=$(node -e "process.stdout.write(String(require('./coverage/coverage-summary.json').total.lines.pct))")
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"

      - name: Update frontend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.FRONTEND_COVERAGE_GIST_ID }}
          filename: grimoire-frontend-coverage.json
          label: frontend coverage
          message: ${{ steps.frontend_cov.outputs.pct }}%
          valColorRange: ${{ steps.frontend_cov.outputs.pct }}
          minColorRange: 50
          maxColorRange: 90

  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    # See the frontend job: skip the redundant `pull_request` run for the
    # `dev -> main` PR, which is already covered by the `push` run on `dev`.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the per-changed-file coverage gate can diff against
          # the PR base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Run lint
        run: ruff check backend/

      - name: Check imports
        run: python -c "import backend.main"

      - name: Type check
        run: mypy backend/

      - name: Run tests with coverage
        run: pytest backend/tests/ -v --cov=backend --cov-report=json --cov-report=term

      - name: Check per-changed-file coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          python backend/scripts/check_coverage.py

      # See the frontend job: publish a coverage badge on push to main only.
      # Reads the total line-coverage % from coverage.py's JSON report and writes
      # it to a Shields.io endpoint gist. Requires GIST_SECRET + BACKEND_COVERAGE_GIST_ID.
      - name: Extract backend coverage %
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: backend_cov
        run: |
          pct=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 1))")
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"

      - name: Update backend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BACKEND_COVERAGE_GIST_ID }}
          filename: grimoire-backend-coverage.json
          label: backend coverage
          message: ${{ steps.backend_cov.outputs.pct }}%
          valColorRange: ${{ steps.backend_cov.outputs.pct }}
          minColorRange: 50
          maxColorRange: 90
