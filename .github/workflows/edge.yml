name: Edge

# Builds a multi-arch edge image from the dev branch after CI succeeds.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/grimoire

jobs:
  edge:
    name: Build and push edge
    runs-on: ubuntu-latest
    # Build once per dev push. A direct push to dev with an open dev->main PR
    # produces two CI runs (one `push`, one `pull_request`); only the push run
    # should trigger an edge build, otherwise the image is built twice.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.event == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push edge
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ocr
          push: true
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            APP_VERSION=edge
            COMMIT_HASH=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ env.IMAGE }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
