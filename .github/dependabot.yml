# Version updates for every ecosystem the repo pins. Security updates are on
# regardless; this adds routine bumps, grouped so a single maintainer sees a
# handful of PRs a week rather than one per package. See docs/pipelines.md.
version: 2
updates:
  - package-ecosystem: pip
    # / holds requirements-test.txt, and Dependabot's scan from / also finds
    # backend/requirements.txt (the runtime pins). Listing /backend as well
    # opened every runtime bump twice.
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: Build
      include: scope
    groups:
      # Moved together: FastAPI pins a Starlette range and both lean on
      # Pydantic, so bumping one alone tends not to resolve.
      web-stack:
        patterns: [fastapi, starlette, "uvicorn*", "pydantic*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # PyMuPDF 2 makes onnxruntime, numpy, networkx and its layout packages hard
      # dependencies and imports the layout model on `import fitz`, with no way
      # to turn it off: ~120 MB more memory in every process that opens a PDF
      # (server and each render worker) and ~135 MB more image. 1.x patch and
      # minor releases still come through. Security advisories still raise
      # Dependabot alerts, but a fix released only on 2.x gets no PR - check
      # the alert and decide by hand.
      - dependency-name: pymupdf
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: Build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native port) is held back until the tools built on
      # TypeScript's JS API support it: openapi-typescript (generates
      # src/api/schema.d.ts) peers on ^5 and typescript-eslint on <6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: Build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: Build
      include: scope
    ignore:
      # The image's Python and Node must match the versions ci.yml tests with,
      # so a runtime move is a deliberate change to both, not a Dependabot bump.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
