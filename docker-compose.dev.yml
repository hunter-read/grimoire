# Development compose — run with: docker compose -f docker-compose.dev.yml watch

services:
  grimoire:
    build:
      context: .
    image: hunterreadca/grimoire
    container_name: grimoire
    restart: unless-stopped
    ports:
      - "9481:9481"
    volumes:
      # Writable so in-app file management and sidecar export work in dev.
      - ./library:/library
      - ./data:/data
    environment:
      - LIBRARY_PATH=/library
      - DATA_PATH=/data
      - WORKERS=1
      # Dev default only; set VALKEY_PASSWORD to override.
      - VALKEY_URL=redis://:${VALKEY_PASSWORD:-grimoire-dev}@valkey:6379/0
      - OPDS_ENABLED=true
      - LOG_LEVEL=debug
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
          ignore:
            - __pycache__
            - "*.pyc"
            - "*.pyo"
            - tests/
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/package.json

  valkey:
    image: valkey/valkey:8-alpine
    container_name: grimoire-valkey
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-grimoire-dev}"]
    volumes:
      - valkey-data:/data

volumes:
  valkey-data:
