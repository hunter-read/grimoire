# Alembic configuration for Grimoire.
#
# The database URL is NOT set here — env.py pulls the live engine and metadata
# from backend.config / backend.models so migrations always target the same
# SQLite database the app uses (DATA_PATH/grimoire.db). Run migrations with:
#
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#
# At runtime the app applies migrations itself on startup (see
# backend/models/db.py); this file is for authoring migrations during development.

[alembic]
script_location = backend/migrations
# Use a path-safe, sortable revision id prefix (UTC timestamp) for new revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
