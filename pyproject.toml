[tool.ruff]
# Match the runtime target and keep line length aligned with the existing code.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Seeded ruleset that fits the existing PEP 8 code:
#   E/W  pycodestyle    F  pyflakes (unused imports/vars, undefined names)
#   C901 mccabe complexity, capped below
select = ["E", "W", "F", "C901"]
ignore = [
    "E501",   # line length is enforced by `ruff format`, not the linter
    # SQLAlchemy filter expressions require `== True` / `!= True`; the Pythonic
    # `not column` rewrite ruff suggests changes the generated SQL and is wrong.
    "E712",
]

[tool.ruff.lint.mccabe]
# A ceiling at today's most complex function (services/characters/schema.py
# validate_schema), so nothing new grows past it (issue #714). Ratchet it down
# as the functions above 20 are broken up; never raise it.
max-complexity = 33

[tool.mypy]
# Static type checking for the backend. Introduced gradually (see issue #164):
# the base config is deliberately lenient so it passes on the current tree, and
# per-module overrides below ratchet up strictness on the pure-logic modules.
python_version = "3.12"
ignore_missing_imports = true
exclude = '(backend/tests/|backend/migrations/)'

# Non-handler "core logic" modules (helpers, models, indexer, config, services):
# require full function annotations so return-type-hint coverage can't regress.
# Router handler modules are intentionally excluded for now and can be ratcheted
# in later. Note this exemption does NOT cost the OpenAPI schema anything: the
# response shape of each route comes from the explicit `response_model=` on its
# `add_api_route(...)` registration, not from the handler's return annotation.
[[tool.mypy.overrides]]
module = [
    "backend.config",
    "backend.config.*",
    "backend.auth",
    "backend.password_hash",
    "backend.codex",
    "backend.container_entrypoint",
    "backend.codex.*",
    "backend.api_keys",
    "backend.security",
    "backend.sql_paths",
    "backend.file_cache",
    "backend.filenames",
    "backend.ocr",
    "backend.scheduler",
    "backend.library_watch",
    "backend.library_watch.*",
    "backend.pdf_worker",
    "backend.indexer",
    "backend.indexer.*",
    "backend.mcp_server",
    "backend.mcp_server.*",
    "backend.render",
    "backend.render.*",
    "backend.models.*",
    "backend.services",
    "backend.services.*",
    "backend.text",
    "backend.text.*",
]
disallow_untyped_defs = true
